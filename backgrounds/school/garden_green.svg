<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7f5ec"/>
      <stop offset="60%" stop-color="#d4ecd9"/>
      <stop offset="100%" stop-color="#bfe0c8"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6cf"/><stop offset="100%" stop-color="#fff6cf" stop-opacity="0"/>
    </radialGradient>
    <g id="tree">
      <rect x="-14" y="0" width="28" height="120" fill="#8a6a48"/>
      <circle cx="0" cy="-40" r="78" fill="#5f9e68"/>
      <circle cx="-62" cy="10" r="52" fill="#6fae77"/>
      <circle cx="64" cy="14" r="56" fill="#4f8e58"/>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="url(#gs)"/>
  <circle cx="1640" cy="190" r="170" fill="url(#sun)"/>
  <!-- 远处连绵树冠 -->
  <g opacity="0.55">
    <ellipse cx="240" cy="700" rx="260" ry="90" fill="#9dc7a4"/>
    <ellipse cx="800" cy="720" rx="320" ry="100" fill="#9dc7a4"/>
    <ellipse cx="1420" cy="700" rx="300" ry="95" fill="#9dc7a4"/>
  </g>
  <!-- 主景树木 -->
  <use href="#tree" transform="translate(300,960) scale(1.25)"/>
  <use href="#tree" transform="translate(1620,980) scale(1.1)"/>
  <use href="#tree" transform="translate(1050,1040) scale(0.9)" opacity="0.85"/>
  <!-- 花丛与草径 -->
  <ellipse cx="960" cy="1120" rx="1100" ry="160" fill="#a7c957" opacity="0.5"/>
  <g fill="#e76f8a"><circle cx="520" cy="1010" r="12"/><circle cx="600" cy="1060" r="10"/><circle cx="1330" cy="1020" r="12"/><circle cx="1420" cy="1070" r="9"/></g>
  <g fill="#ffd98a"><circle cx="560" cy="1044" r="9"/><circle cx="1370" cy="1048" r="10"/></g>
</svg>
