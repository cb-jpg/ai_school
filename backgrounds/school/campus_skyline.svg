  <rect x="120" y="600" width="260" height="480" fill="url(#bldgFar)" opacity="0.55"/>
  <rect x="420" y="520" width="300" height="560" fill="url(#bldgFar)" opacity="0.45"/>
  <rect x="1480" y="560" width="340" height="520" fill="url(#bldgFar)" opacity="0.5"/>
