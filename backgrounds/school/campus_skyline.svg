  <polygon points="745,180 700,300 790,300" fill="#1e5494"/>
  <circle cx="745" cy="255" r="34" fill="#ffffff"/>
  <path d="M745 235 v22 M735 247 h20" stroke="#1e5494" stroke-width="5" stroke-linecap="round"/>
  <polygon points="700,300 745,283 790,300" fill="#16406f"/>
  <rect x="830" y="450" width="420" height="630" fill="url(#bldg)"/>
  <rect x="1290" y="560" width="240" height="520" fill="url(#bldg)"/>
  <rect x="330" y="640" width="350" height="440" fill="url(#bldg)" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.75">
    <rect x="860" y="500" width="52" height="72"/><rect x="950" y="500" width="52" height="72"/><rect x="1040" y="500" width="52" height="72"/><rect x="1130" y="500" width="52" height="72"/>
    <rect x="860" y="640" width="52" height="72"/><rect x="950" y="640" width="52" height="72"/><rect x="1040" y="640" width="52" height="72"/><rect x="1130" y="640" width="52" height="72"/>
    <rect x="1320" y="620" width="46" height="64"/><rect x="1400" y="620" width="46" height="64"/><rect x="1480" y="620" width="26" height="64"/>
    <rect x="370" y="700" width="44" height="60"/><rect x="450" y="700" width="44" height="60"/><rect x="530" y="700" width="44" height="60"/><rect x="610" y="700" width="44" height="60"/>
  </g>
  <!-- 前景绿化带 -->
  <ellipse cx="400" cy="1090" rx="520" ry="130" fill="#a7c957" opacity="0.65"/>
  <ellipse cx="1500" cy="1100" rx="640" ry="150" fill="#a7c957" opacity="0.55"/>
